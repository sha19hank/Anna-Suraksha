name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + type-check + test ───────────────────────────────────
  backend:
    name: Backend (CDK + Lambda)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --ci --coverage --coverageReporters=text

      - name: CDK synth (validates infra)
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'   # dummy — synth only
          CDK_DEFAULT_REGION: 'ap-south-1'
        run: npx cdk synth --quiet

  # ── Web: type-check + build ──────────────────────────────────────────────
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build (validates pages + routes)
        env:
          NEXT_PUBLIC_API_URL: https://example.execute-api.ap-south-1.amazonaws.com
          NEXT_PUBLIC_USER_POOL_ID: ap-south-1_PLACEHOLDER
          NEXT_PUBLIC_WEB_CLIENT_ID: PLACEHOLDER
        run: npm run build

  # ── Mobile: type-check ───────────────────────────────────────────────────
  mobile:
    name: Mobile (Expo / React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check
