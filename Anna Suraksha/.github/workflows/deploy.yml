name: Deploy to AWS (ap-south-1)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run_sms:
        description: 'Keep DRY_RUN_SMS=true?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  deploy-infra:
    name: CDK deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy AnnaSurakshaMvpStack --require-approval never --outputs-file ../cdk-outputs.json
        env:
          DRY_RUN_SMS: ${{ github.event.inputs.dry_run_sms || 'true' }}

      - name: Upload CDK outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: cdk-outputs.json
          retention-days: 30

  deploy-web:
    name: Web deploy (Vercel)
    runs-on: ubuntu-latest
    needs: deploy-infra
    if: ${{ vars.DEPLOY_WEB == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --token $VERCEL_TOKEN
